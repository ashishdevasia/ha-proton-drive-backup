name: Check Proton Drive CLI version

on:
  schedule:
    - cron: "37 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Read pinned and latest versions
        id: versions
        run: |
          manifest=$(curl -fsS --max-time 30 https://proton.me/download/drive/cli/version.json)
          latest=$(jq -r '.Releases[0].Version' <<<"$manifest")
          released=$(jq -r '.Releases[0].ReleaseDate' <<<"$manifest")
          pinned=$(yq '.args.PROTON_CLI_VERSION' ha-proton-drive-backup/build.yaml)
          # fail loudly if either source stops looking like a version
          [ "$(printf '%s\n%s\n' "$latest" "$pinned" | grep -Ec '^[0-9]+\.[0-9]+\.[0-9]+$')" = 2 ]
          {
            echo "latest=$latest"
            echo "released=$released"
            echo "pinned=$pinned"
          } >> "$GITHUB_OUTPUT"

      - name: Open issue if a newer version exists
        if: steps.versions.outputs.latest != steps.versions.outputs.pinned
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ steps.versions.outputs.latest }}
          RELEASED: ${{ steps.versions.outputs.released }}
          PINNED: ${{ steps.versions.outputs.pinned }}
        run: |
          title="Proton Drive CLI $LATEST available"
          gh label create proton-cli-update --force \
            --description "Proton Drive CLI version bump" --color 0E8A16
          # dedup: one issue per version, closed counts as handled
          if gh issue list --state all --label proton-cli-update \
               --search "in:title \"$title\"" --json title --jq '.[].title' \
               | grep -Fxq "$title"; then
            echo "Issue for $LATEST already exists, skipping"
            exit 0
          fi
          gh issue create --title "$title" --label proton-cli-update --body "Proton released CLI **$LATEST** on $RELEASED. The add-on currently pins **$PINNED**.

          - Manifest (checksums per platform): https://proton.me/download/drive/cli/version.json
          - Source diff: https://github.com/ProtonDriveApps/sdk/compare/cli/v$PINNED...cli/v$LATEST

          To update:
          - [ ] Bump \`ARG PROTON_CLI_VERSION\` in \`ha-proton-drive-backup/Dockerfile\`
          - [ ] Bump \`args.PROTON_CLI_VERSION\` in \`ha-proton-drive-backup/build.yaml\`
          - [ ] Refresh \`PROTON_CLI_SHA256_AMD64\`/\`_AARCH64\` in the Dockerfile. **The amd64 build must run without AVX**: since 0.9.0 Proton ships only plain \`linux-x64\` (no \`-baseline\` row), built with Bun 1.4, whose only x64 target is Nehalem. CLI 0.7/0.8's plain build needed AVX/x86-64-v3 and SIGILLed on older CPUs/VMs (see v0.2.1 changelog). Confirm the new binary still runs under \`qemu-x86_64 -cpu Nehalem\` against a non-AVX glibc: \`-L\` a full Debian rootfs (debootstrap), since a host glibc built for x86-64-v3 SIGILLs on its own and a bare libc6 extract lets the host's \`nsswitch.conf\`/NSS modules in, which crash on DNS and look like a CPU problem. Check a TLS fetch (\`BUN_BE_BUN=1 ... -e \"fetch(...)\"\`), not just startup, with 0.8.0's plain \`linux-x64\` SIGILLing as the control; if a \`linux-x64-baseline\` row comes back, pin that one.
          - [ ] Run \`python3 ha-proton-drive-backup/distrust_roots.py\` and then \`distrust_roots.py --verify\` on a copy of the new linux-x64 binary (verify runs it). Both must pass; a root listed for review stops them for a decision. To prune, run \`--verify\` on an UNPATCHED copy: it lists every distrusted root the CLI still trusts, and a \`DISTRUSTED\` entry can go only once it's missing from that list, i.e. Proton's CLI no longer trusts that root at all.
          - [ ] Re-verify the CLI error contract still matches \`_classify_failure\` in \`backup/proton/protoncli.py\`
          - [ ] Re-check every CLI behavior that a code comment pins to a version range against the source diff, then extend the range (\`grep -rn $PINNED ha-proton-drive-backup/backup ha-proton-drive-backup/tests\` lists them)"
