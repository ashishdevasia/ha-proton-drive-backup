# Names and descriptions for the add-on's Configuration tab in Home Assistant
# (one file per language; Home Assistant falls back to en.yaml). Every option
# in config.json needs an entry; tests/test_translations.py checks that.
configuration:
  max_backups_in_ha:
    name: Home Assistant-ൽ സൂക്ഷിക്കേണ്ട ബാക്കപ്പുകൾ
    description: ഈ മെഷീനിൽ സൂക്ഷിക്കേണ്ട പുതിയ ബാക്കപ്പുകളുടെ എണ്ണം; ഏറ്റവും പഴയത് ആദ്യം ഡിലീറ്റ് ആകും. 0 ആണെങ്കിൽ Home Assistant-ൽ നിന്ന് ഒരിക്കലും ഡിലീറ്റ് ചെയ്യില്ല (ലോക്കൽ കോപ്പി ഒന്നും വേണ്ടെങ്കിൽ “അപ്‌ലോഡ് കഴിഞ്ഞാൽ Home Assistant-ൽ നിന്ന് ഡിലീറ്റ് ചെയ്യൂ” ഓൺ ആക്കൂ).
  max_backups_in_proton_drive:
    name: Proton Drive-ൽ സൂക്ഷിക്കേണ്ട ബാക്കപ്പുകൾ
    description: Proton Drive-ൽ സൂക്ഷിക്കേണ്ട പുതിയ ബാക്കപ്പുകളുടെ എണ്ണം; ഏറ്റവും പഴയത് ആദ്യം ഡിലീറ്റ് ആകും. 0 ആണെങ്കിൽ Proton Drive-ൽ നിന്ന് ഒരിക്കലും ഡിലീറ്റ് ചെയ്യില്ല.
  days_between_backups:
    name: എത്ര ദിവസം കൂടുമ്പോൾ ബാക്കപ്പ്
    description: എത്ര ദിവസം കൂടുമ്പോൾ പുതിയ ബാക്കപ്പ് എടുക്കണം (1.5 പോലെയും കൊടുക്കാം). ബാക്കപ്പ് സമയം കൊടുത്തിട്ടുണ്ടെങ്കിൽ മുഴുവൻ ദിവസത്തിലേക്ക് റൗണ്ട് അപ്പ് ചെയ്യും. 0 ആണെങ്കിൽ ഷെഡ്യൂൾഡ് ബാക്കപ്പുകൾ ഓഫ് ആകും.
  ignore_other_backups:
    name: ഈ ആപ്പ് എടുക്കാത്ത ബാക്കപ്പുകൾ ഇഗ്നോർ ചെയ്യൂ
    description: ഈ ആപ്പ് എടുക്കാത്ത ബാക്കപ്പുകൾ മാനേജ് ചെയ്യുകയോ ഡിലീറ്റ് ചെയ്യുകയോ ഇല്ല.
  ignore_upgrade_backups:
    name: അപ്‌ഗ്രേഡ് ബാക്കപ്പുകൾ ഇഗ്നോർ ചെയ്യൂ
    description: അപ്‌ഗ്രേഡ് സമയത്ത് Home Assistant തനിയെ എടുക്കുന്ന ബാക്കപ്പുകൾ കണക്കിലെടുക്കില്ല.
  backup_storage:
    name: ബാക്കപ്പ് ലൊക്കേഷൻ
    description: ബാക്കപ്പുകൾ എടുക്കേണ്ട Home Assistant നെറ്റ്‌വർക്ക് സ്റ്റോറേജിന്റെ പേര്, അല്ലെങ്കിൽ local-disk. ഒഴിച്ചിട്ടാൽ Home Assistant-ന്റെ ഡിഫോൾട്ട് ബാക്കപ്പ് ലൊക്കേഷൻ ഉപയോഗിക്കും.
  delete_after_upload:
    name: അപ്‌ലോഡ് കഴിഞ്ഞാൽ Home Assistant-ൽ നിന്ന് ഡിലീറ്റ് ചെയ്യൂ
    description: അപ്‌ലോഡ് കഴിഞ്ഞാൽ ബാക്കപ്പുകൾ Proton Drive-ൽ മാത്രം സൂക്ഷിക്കും.
  delete_before_new_backup:
    name: പുതിയത് എടുക്കും മുമ്പ് പഴയ ബാക്കപ്പ് ഡിലീറ്റ് ചെയ്യൂ
    description: 'ഡിസ്ക് സ്പേസ് കുറവാണെങ്കിൽ ഉപകാരപ്പെടും: ഏറ്റവും പഴയ ബാക്കപ്പ് ആദ്യം ഡിലീറ്റ് ചെയ്യും.'
  use_ssl:
    name: SSL ഉപയോഗിക്കൂ
    description: “സർട്ടിഫിക്കറ്റ് ഫയൽ”, “കീ ഫയൽ” എന്നിവ വെച്ച് എക്സ്ട്രാ വെബ് സെർവർ HTTPS വഴി ആക്കും.
  certfile:
    name: സർട്ടിഫിക്കറ്റ് ഫയൽ
    description: '“SSL ഉപയോഗിക്കൂ” ഓൺ ആണെങ്കിൽ വേണ്ട സർട്ടിഫിക്കറ്റ്. ഡിഫോൾട്ട്: /ssl/fullchain.pem.'
  keyfile:
    name: കീ ഫയൽ
    description: '“SSL ഉപയോഗിക്കൂ” ഓൺ ആണെങ്കിൽ വേണ്ട പ്രൈവറ്റ് കീ. ഡിഫോൾട്ട്: /ssl/privkey.pem.'
  require_login:
    name: Home Assistant ലോഗിൻ നിർബന്ധമാക്കൂ
    description: എക്സ്ട്രാ വെബ് സെർവറിൽ ഒരു Home Assistant അഡ്മിന്റെ യൂസർനെയിമും പാസ്‌വേഡും ചോദിക്കും. എക്സ്ട്രാ സെർവർ ഓൺ ആണെങ്കിൽ ഇതും എപ്പോഴും ഓൺ ആക്കി വെക്കൂ.
  backup_name:
    name: പേരിന്റെ ടെംപ്ലേറ്റ്
    description: ബാക്കപ്പുകളുടെ പേരിനുള്ള ടെംപ്ലേറ്റ്, ഉദാ. {type} Backup {year}-{month}-{day}. ഉപയോഗിക്കാവുന്ന എല്ലാ പ്ലേസ്‌ഹോൾഡറുകളും വെബ് UI-യിലെ സെറ്റിങ്സിൽ ഉണ്ട്.
  backup_time_of_day:
    name: ബാക്കപ്പ് സമയം
    description: ഷെഡ്യൂൾഡ് ബാക്കപ്പുകൾ എടുക്കേണ്ട ലോക്കൽ സമയം, HH:MM ആയി (24 മണിക്കൂർ). ഒഴിച്ചിട്ടാൽ ഏത് സമയവും.
  warn_for_low_space:
    name: സ്പേസ് കുറയുമ്പോൾ അറിയിക്കൂ
    description: ബാക്കപ്പ് എടുക്കും മുമ്പ് ഡിസ്കിലെ ഫ്രീ സ്പേസ് നോക്കും; കുറവാണെങ്കിൽ ഒരു വാണിങ് കാണിച്ച് നിർത്തും.
  watch_backup_directory:
    name: ബാക്കപ്പ് ഫോൾഡർ ശ്രദ്ധിക്കൂ
    description: പുതിയതോ നീക്കിയതോ ആയ ബാക്കപ്പ് ഫയലുകൾ അടുത്ത സിങ്ക് വരെ കാത്തിരിക്കാതെ ഉടൻ കണ്ടുപിടിക്കും.
  generational_days:
    name: എത്ര ദിവസത്തെ ബാക്കപ്പ് സൂക്ഷിക്കണം
    description: 'ജനറേഷണൽ ബാക്കപ്പുകൾ: എത്ര ദിവസത്തെ ബാക്കപ്പ് സൂക്ഷിക്കണം (ദിവസത്തിൽ ഒന്ന്). ഏതെങ്കിലും ജനറേഷണൽ ഓപ്ഷൻ സെറ്റ് ചെയ്തിട്ടുണ്ടെങ്കിൽ 0 കൊടുത്താൽ 1 ആയി എടുക്കും, അതുകൊണ്ട് ഏറ്റവും പുതിയ ബാക്കപ്പ് എപ്പോഴും ഉണ്ടാകും.'
  generational_weeks:
    name: എത്ര ആഴ്ചത്തെ ബാക്കപ്പ് സൂക്ഷിക്കണം
    description: 'ജനറേഷണൽ ബാക്കപ്പുകൾ: എത്ര ആഴ്ചത്തെ ബാക്കപ്പ് സൂക്ഷിക്കണം (ആഴ്ചയിൽ ഒന്ന്).'
  generational_months:
    name: എത്ര മാസത്തെ ബാക്കപ്പ് സൂക്ഷിക്കണം
    description: 'ജനറേഷണൽ ബാക്കപ്പുകൾ: എത്ര മാസത്തെ ബാക്കപ്പ് സൂക്ഷിക്കണം (മാസത്തിൽ ഒന്ന്).'
  generational_years:
    name: എത്ര വർഷത്തെ ബാക്കപ്പ് സൂക്ഷിക്കണം
    description: 'ജനറേഷണൽ ബാക്കപ്പുകൾ: എത്ര വർഷത്തെ ബാക്കപ്പ് സൂക്ഷിക്കണം (വർഷത്തിൽ ഒന്ന്).'
  generational_day_of_year:
    name: വർഷത്തിലെ ബാക്കപ്പ് ദിവസം
    description: വർഷത്തിലെ ഏത് ദിവസത്തെ (1–365) ബാക്കപ്പ് ആണ് ആ വർഷത്തേതായി സൂക്ഷിക്കേണ്ടത്.
  generational_day_of_month:
    name: മാസത്തിലെ ബാക്കപ്പ് ദിവസം
    description: മാസത്തിലെ ഏത് ദിവസത്തെ (1–31) ബാക്കപ്പ് ആണ് ആ മാസത്തേതായി സൂക്ഷിക്കേണ്ടത്.
  generational_day_of_week:
    name: ആഴ്ചയിലെ ബാക്കപ്പ് ദിവസം
    description: ആഴ്ചയിലെ ഏത് ദിവസത്തെ ബാക്കപ്പ് ആണ് ആ ആഴ്ചത്തേതായി സൂക്ഷിക്കേണ്ടത്.
  generational_delete_early:
    name: അധികമുള്ള ബാക്കപ്പുകൾ നേരത്തെ ഡിലീറ്റ് ചെയ്യൂ
    description: എണ്ണത്തിന്റെ ലിമിറ്റ് എത്തും മുമ്പേ ആവശ്യമില്ലാത്ത ബാക്കപ്പുകൾ ഡിലീറ്റ് ചെയ്യും.
  notify_for_stale_backups:
    name: ബാക്കപ്പുകൾ മുടങ്ങിയാൽ അറിയിക്കൂ
    description: ബാക്കപ്പുകൾ മുടങ്ങിയാൽ ഒരു നോട്ടിഫിക്കേഷൻ കാണിക്കും, ആപ്പ് Proton-ൽ നിന്ന് സൈൻ ഔട്ട് ആയതുകൊണ്ട് നിന്നുപോയാലും. പ്രശ്നം തീർന്നാൽ അത് തനിയെ മാറും.
  enable_backup_stale_sensor:
    name: “stale” ബാക്കപ്പ് സെൻസർ
    description: ബാക്കപ്പുകൾ മുടങ്ങുമ്പോൾ ഓൺ ആകുന്ന binary_sensor.backups_stale ഉണ്ടാക്കും.
  enable_backup_state_sensor:
    name: ബാക്കപ്പ് സ്റ്റേറ്റ് സെൻസർ
    description: നിങ്ങളുടെ ബാക്കപ്പുകളുടെ സ്റ്റേറ്റ് കാണിക്കുന്ന sensor.backup_state ഉണ്ടാക്കും.
  backup_password:
    name: ബാക്കപ്പ് പാസ്‌വേഡ്
    description: 'ഈ പാസ്‌വേഡ് വെച്ച് ബാക്കപ്പുകൾ എൻക്രിപ്റ്റ് ചെയ്യും. ഒഴിച്ചിട്ടാൽ പാസ്‌വേഡ് ഇല്ല. ഇത് എവിടെയെങ്കിലും സേഫ് ആയി സൂക്ഷിക്കൂ: റീസ്റ്റോർ ചെയ്യാൻ ഇത് വേണം.'
  exclude_folders:
    name: ഫോൾഡറുകൾ ഒഴിവാക്കൂ
    description: ബാക്കപ്പിൽ ഉൾപ്പെടുത്തേണ്ടാത്ത ഫോൾഡറുകൾ, കോമ ഇട്ട് വേർതിരിച്ച്, ഉദാ. share,media. ഇത് സെറ്റ് ചെയ്താൽ ബാക്കപ്പുകൾ പാർഷ്യൽ ആകും.
  exclude_addons:
    name: ആപ്പുകൾ ഒഴിവാക്കൂ
    description: ബാക്കപ്പിൽ ഉൾപ്പെടുത്തേണ്ടാത്ത ആപ്പുകളുടെ സ്ലഗുകൾ, കോമ ഇട്ട് വേർതിരിച്ച്, ഉദാ. core_mariadb. ഇത് സെറ്റ് ചെയ്താൽ ബാക്കപ്പുകൾ പാർഷ്യൽ ആകും.
  exclude_ha_database:
    name: Home Assistant ഡാറ്റാബേസ് ഒഴിവാക്കൂ
    description: ബാക്കപ്പുകളുടെ സൈസ് കുറയ്ക്കാൻ home-assistant_v2.db ഒഴിവാക്കും.
  stop_addons:
    name: ബാക്കപ്പ് സമയത്ത് ആപ്പുകൾ നിർത്തൂ
    description: ബാക്കപ്പിന് മുമ്പ് നിർത്തി, ശേഷം വീണ്ടും സ്റ്റാർട്ട് ചെയ്യേണ്ട ആപ്പുകളുടെ സ്ലഗുകൾ, കോമ ഇട്ട് വേർതിരിച്ച് (ഡാറ്റാബേസുകൾക്ക് നല്ലതാണ്).
  expose_extra_server:
    name: എക്സ്ട്രാ വെബ് സെർവർ ഓൺ ആക്കൂ
    description: Home Assistant ingress-ന് പുറത്ത്, സ്വന്തം പോർട്ടിലും വെബ് UI തുറക്കാം. ഇതിന്റെ കൂടെ “Home Assistant ലോഗിൻ നിർബന്ധമാക്കൂ” ഓൺ ആക്കൂ.
  confirm_multiple_deletes:
    name: ഒന്നിൽ കൂടുതൽ ബാക്കപ്പുകൾ ഡിലീറ്റ് ചെയ്യും മുമ്പ് ചോദിക്കൂ
    description: ഒന്നിൽ കൂടുതൽ പഴയ ബാക്കപ്പുകൾ ഒരുമിച്ച് ഡിലീറ്റ് ചെയ്യും മുമ്പ് നിർത്തി വെബ് UI-യിൽ ചോദിക്കും.
  enable_proton_upload:
    name: ബാക്കപ്പുകൾ Proton Drive-ലേക്ക് അപ്‌ലോഡ് ചെയ്യൂ
    description: ഓഫ് ആണെങ്കിൽ ആപ്പ് Home Assistant-നുള്ളിലെ ബാക്കപ്പുകൾ മാത്രം മാനേജ് ചെയ്യും.
  proton_folder_name:
    name: Proton Drive ഫോൾഡർ
    description: ബാക്കപ്പുകൾ സൂക്ഷിക്കുന്ന, Proton Drive-ന്റെ റൂട്ടിന് താഴെയുള്ള ഫോൾഡർ. ഫോൾഡറിനുള്ളിൽ ഫോൾഡർ വേണമെങ്കിൽ / ഉപയോഗിക്കൂ, ഉദാ. backups/ha. ഇതിന് മാത്രമായി ഒരു ഫോൾഡർ കൊടുക്കൂ.
  proton_cli_path:
    name: proton-drive CLI പാത്ത്
    description: ആപ്പിന്റെ കൂടെയുള്ള Proton Drive CLI-യുടെ പാത്ത്.
  proton_data_path:
    name: Proton ഡാറ്റ പാത്ത്
    description: CLI അതിന്റെ സെഷൻ, കീറിങ്, ട്രാൻസ്ഫറിനുള്ള ടെമ്പററി ഫയലുകൾ എന്നിവ സൂക്ഷിക്കുന്ന സ്ഥലം.
  proton_drive_timeout_seconds:
    name: CLI ടൈംഔട്ട്
    description: ലിസ്റ്റിങ്, മെറ്റാഡാറ്റ പോലുള്ള കാര്യങ്ങൾക്ക് എത്ര സെക്കൻഡ് കാത്തിരിക്കണം.
  proton_transfer_timeout_seconds:
    name: ട്രാൻസ്ഫർ ടൈംഔട്ട്
    description: ഒരു അപ്‌ലോഡിനോ ഡൗൺലോഡിനോ എത്ര സെക്കൻഡ് കാത്തിരിക്കണം.
  permanently_delete:
    name: നീക്കിയ ബാക്കപ്പുകൾ പെർമനന്റ് ആയി ഡിലീറ്റ് ചെയ്യൂ
    description: ഡിലീറ്റ് ചെയ്ത ബാക്കപ്പുകൾ Proton Drive-ന്റെ ട്രാഷിൽ നിന്നും കളയും, അപ്പോൾ അവ സ്റ്റോറേജ് ക്വോട്ടയിൽ കൂട്ടില്ല. ട്രാഷിൽ നിന്ന് തിരിച്ചെടുക്കാൻ പറ്റുന്ന രീതിയിൽ വെക്കണമെങ്കിൽ ഓഫ് ആക്കൂ.
  delete_ignored_after_days:
    name: ഇഗ്നോർ ചെയ്ത ബാക്കപ്പുകൾ എത്ര ദിവസം കഴിഞ്ഞ് ഡിലീറ്റ് ചെയ്യണം
    description: ഇഗ്നോർ ചെയ്ത ബാക്കപ്പുകൾ തനിയെ ഡിലീറ്റ് ആകാനുള്ള ദിവസങ്ങൾ. 0 ആണെങ്കിൽ എന്നും സൂക്ഷിക്കും.
  call_backup_snapshot:
    name: ബാക്കപ്പുകളെ “snapshots” എന്ന് വിളിക്കൂ
    description: നോട്ടിഫിക്കേഷനുകളിലും സെൻസറുകളിലും പഴയ വാക്കായ “snapshot” ഉപയോഗിക്കും.
  background_color:
    name: ബാക്ക്ഗ്രൗണ്ട് കളർ
    description: 'വെബ് UI-യുടെ ബാക്ക്ഗ്രൗണ്ട് കളർ, #RRGGBB ആയി. ഒഴിച്ചിട്ടാൽ ഡിഫോൾട്ട്.'
  accent_color:
    name: ആക്സന്റ് കളർ
    description: 'വെബ് UI-യുടെ ആക്സന്റ് കളർ, #RRGGBB ആയി. ഒഴിച്ചിട്ടാൽ ഡിഫോൾട്ട്.'
  max_sync_interval_seconds:
    name: സിങ്കുകൾക്കിടയിലെ പരമാവധി സമയം
    description: രണ്ട് സിങ്കുകൾക്കിടയിൽ ആപ്പ് പരമാവധി കാത്തിരിക്കുന്ന സമയം, സെക്കൻഡിൽ (കുറഞ്ഞത് 300).
  default_sync_interval_variation:
    name: സിങ്ക് ഇടവേളയിലെ വ്യത്യാസം
    description: ഇടയ്ക്കിടെയുള്ള സിങ്കിന്റെ സമയത്തിൽ വരുന്ന റാൻഡം വ്യത്യാസം, പരമാവധി സിങ്ക് ഇടവേളയുടെ ഒരു ഭാഗമായി (0–1). 0.5-ഉം 3 മണിക്കൂറും ആണെങ്കിൽ, സിങ്കുകൾ 1.5 മുതൽ 3 മണിക്കൂർ വരെ ഇടവിട്ട് നടക്കും.
  port:
    name: എക്സ്ട്രാ വെബ് സെർവർ പോർട്ട്
    description: 'എക്സ്ട്രാ വെബ് സെർവർ ആപ്പിനുള്ളിൽ റൺ ചെയ്യുന്ന പോർട്ട്. ഡിഫോൾട്ട്: 8471.'
  log_level:
    name: ലോഗ് ലെവൽ (വെബ് UI)
    description: വെബ് UI-യിലെ ലോഗുകൾ ടാബിലും ബഗ് റിപ്പോർട്ടുകളിലും എത്ര വിവരങ്ങൾ സൂക്ഷിക്കണം.
  console_log_level:
    name: ലോഗ് ലെവൽ (കൺസോൾ)
    description: Home Assistant-ൽ ആപ്പിന്റെ Log ടാബിൽ എത്ര വിവരങ്ങൾ കാണിക്കണം.
  max_backoff_seconds:
    name: വീണ്ടും ശ്രമിക്കാനുള്ള പരമാവധി ഇടവേള
    description: സിങ്ക് ഫെയിൽ ആയ ശേഷം വീണ്ടും ശ്രമിക്കുന്നതിനിടയിലെ പരമാവധി കാത്തിരിപ്പ്, സെക്കൻഡിൽ (കുറഞ്ഞത് 3600).
  ha_reporting_interval_seconds:
    name: സെൻസർ അപ്ഡേറ്റ് ഇടവേള
    description: Home Assistant-ലെ സെൻസറുകൾ ആപ്പ് എത്ര സെക്കൻഡ് കൂടുമ്പോൾ അപ്ഡേറ്റ് ചെയ്യണം.
network:
  8471/tcp: എക്സ്ട്രാ വെബ് സെർവർ, ingress-ന് പുറത്ത് (“എക്സ്ട്രാ വെബ് സെർവർ ഓൺ ആക്കൂ” ഓപ്ഷൻ ഓൺ ആണെങ്കിൽ മാത്രം).
