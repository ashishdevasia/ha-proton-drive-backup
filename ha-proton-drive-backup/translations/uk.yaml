# Назви й описи для вкладки «Конфігурація» доповнення в Home Assistant. Див.
# en.yaml.
configuration:
  max_backups_in_ha:
    name: Скільки копій зберігати в Home Assistant
    description: Скільки найновіших копій зберігати на цьому пристрої; найстаріша видаляється першою. 0 — ніколи не видаляти з Home Assistant (щоб не зберігати локальних копій, увімкніть натомість «Видаляти з Home Assistant після вивантаження»).
  max_backups_in_proton_drive:
    name: Скільки копій зберігати в Proton Drive
    description: Скільки найновіших копій зберігати в Proton Drive; найстаріша видаляється першою. 0 — ніколи не видаляти з Proton Drive.
  days_between_backups:
    name: Кількість днів між копіями
    description: Як часто створюється нова копія, у днях (можна дробове число). Якщо задано час доби, значення округлюється вгору до цілих днів. 0 вимикає копії за розкладом.
  ignore_other_backups:
    name: Ігнорувати копії, створені деінде
    description: Не керувати копіями, які створило не це доповнення, і не видаляти їх.
  ignore_upgrade_backups:
    name: Ігнорувати копії з оновлень
    description: Не враховувати копії, які Home Assistant автоматично створює під час оновлень.
  backup_storage:
    name: Розташування копій
    description: Назва мережевого сховища Home Assistant, у якому створювати копії, або local-disk. Порожнє значення — типове розташування копій Home Assistant.
  delete_after_upload:
    name: Видаляти з Home Assistant після вивантаження
    description: Після вивантаження зберігати копії лише в Proton Drive.
  delete_before_new_backup:
    name: Видаляти стару копію перед створенням нової
    description: 'Корисно, коли мало місця на диску: спочатку видаляє найстарішу копію.'
  use_ssl:
    name: Використовувати SSL
    description: Вмикати HTTPS на додатковому вебсервері, використовуючи «Файл сертифіката» і «Файл ключа».
  certfile:
    name: Файл сертифіката
    description: 'Сертифікат для «Використовувати SSL». Типово: /ssl/fullchain.pem.'
  keyfile:
    name: Файл ключа
    description: 'Приватний ключ для «Використовувати SSL». Типово: /ssl/privkey.pem.'
  require_login:
    name: Вимагати вхід у Home Assistant
    description: Запитувати імʼя користувача й пароль адміністратора Home Assistant на додатковому вебсервері. Не вимикайте, поки додатковий сервер увімкнено.
  backup_name:
    name: Шаблон назви
    description: Шаблон назв копій, напр. {type} Backup {year}-{month}-{day}. Усі заповнювачі перелічено в налаштуваннях вебінтерфейсу.
  backup_time_of_day:
    name: Час доби
    description: Місцевий час створення копій за розкладом, у форматі HH:MM (24 години). Порожнє значення — будь-який час.
  warn_for_low_space:
    name: Попереджати, коли мало місця
    description: Перевіряти вільне місце на диску перед створенням копії і зупинятися з попередженням, якщо його мало.
  watch_backup_directory:
    name: Стежити за папкою копій
    description: Помічати нові чи видалені файли копій одразу, а не під час наступної синхронізації.
  generational_days:
    name: Скільки щоденних копій зберігати
    description: 'Копії за поколіннями: скільки щоденних копій зберігати. Поки задано будь-який параметр поколінь, 0 вважається за 1, тож найновіша копія зберігається завжди.'
  generational_weeks:
    name: Скільки щотижневих копій зберігати
    description: 'Копії за поколіннями: скільки щотижневих копій зберігати.'
  generational_months:
    name: Скільки щомісячних копій зберігати
    description: 'Копії за поколіннями: скільки щомісячних копій зберігати.'
  generational_years:
    name: Скільки щорічних копій зберігати
    description: 'Копії за поколіннями: скільки щорічних копій зберігати.'
  generational_day_of_year:
    name: День щорічної копії
    description: День року (1–365), копія якого зберігається як щорічна.
  generational_day_of_month:
    name: День щомісячної копії
    description: День місяця (1–31), копія якого зберігається як щомісячна.
  generational_day_of_week:
    name: День щотижневої копії
    description: День тижня, копія якого зберігається як щотижнева.
  generational_delete_early:
    name: Видаляти зайві копії заздалегідь
    description: Видаляти зайві копії ще до того, як буде досягнуто ліміту кількості.
  notify_for_stale_backups:
    name: Сповіщати про застарілі копії
    description: Надсилати постійне сповіщення, якщо копії перестануть створюватися, зокрема коли їх призупинено, бо доповнення не ввійшло в Proton.
  enable_backup_stale_sensor:
    name: Датчик застарілих копій
    description: Створити binary_sensor.backups_stale, який вмикається, коли копії застаріли.
  enable_backup_state_sensor:
    name: Датчик стану копій
    description: Створити sensor.backup_state, який показує стан ваших копій.
  backup_password:
    name: Пароль до копій
    description: 'Шифрувати копії цим паролем. Порожнє значення — без пароля. Зберігайте його в надійному місці: без нього копію не відновити.'
  exclude_folders:
    name: Виключити папки
    description: Папки через кому, які не треба включати в копії, напр. share,media. Із цим параметром копії стають частковими.
  exclude_addons:
    name: Виключити доповнення
    description: Slug-и доповнень через кому, які не треба включати в копії, напр. core_mariadb. Із цим параметром копії стають частковими.
  exclude_ha_database:
    name: Виключити базу даних Home Assistant
    description: Не включати home-assistant_v2.db у копії, щоб вони були меншими.
  stop_addons:
    name: Зупиняти доповнення під час копіювання
    description: Slug-и доповнень через кому, які зупиняються перед копіюванням і знову запускаються після нього (корисно для баз даних).
  expose_extra_server:
    name: Увімкнути додатковий вебсервер
    description: Відкривати вебінтерфейс ще й на окремому порту, поза ingress Home Assistant. Разом із цим увімкніть «Вимагати вхід у Home Assistant».
  confirm_multiple_deletes:
    name: Питати перед видаленням кількох копій
    description: Зупинятися й питати у вебінтерфейсі, перш ніж видалити більше ніж одну стару копію за раз.
  enable_proton_upload:
    name: Вивантажувати копії в Proton Drive
    description: Якщо вимкнено, доповнення керує копіями лише в Home Assistant.
  proton_folder_name:
    name: Папка в Proton Drive
    description: Папка в корені Proton Drive, де зберігаються копії. Використовуйте / для вкладених папок, напр. backups/ha. Краще виділіть для копій окрему папку.
  proton_cli_path:
    name: Шлях до proton-drive CLI
    description: Шлях до вбудованого Proton Drive CLI.
  proton_data_path:
    name: Шлях до даних Proton
    description: Де CLI зберігає свій сеанс, сховище ключів і тимчасові файли передавання.
  proton_drive_timeout_seconds:
    name: Тайм-аут CLI
    description: Скільки секунд чекати на отримання списків і операції з метаданими.
  proton_transfer_timeout_seconds:
    name: Тайм-аут передавання
    description: Скільки секунд чекати на одне вивантаження чи завантаження.
  permanently_delete:
    name: Прибирати видалені копії з кошика
    description: Також прибирати видалені копії з кошика Proton Drive, щоб вони більше не займали місце у вашому сховищі. Вимкніть, щоб їх можна було відновити з кошика.
  delete_ignored_after_days:
    name: Видаляти ігноровані копії через
    description: Кількість днів, після яких ігноровані копії видаляються автоматично. 0 — зберігати назавжди.
  call_backup_snapshot:
    name: Називати копії «snapshots»
    description: Використовувати старий термін «snapshot» у сповіщеннях і датчиках.
  background_color:
    name: Колір фону
    description: 'Колір фону вебінтерфейсу, у форматі #RRGGBB. Порожнє значення — типовий колір.'
  accent_color:
    name: Акцентний колір
    description: 'Акцентний колір вебінтерфейсу, у форматі #RRGGBB. Порожнє значення — типовий колір.'
  max_sync_interval_seconds:
    name: Макс. інтервал синхронізації
    description: Найдовший час, який доповнення чекає між синхронізаціями, у секундах (щонайменше 300).
  default_sync_interval_variation:
    name: Розкид інтервалу синхронізації
    description: Випадковий розкид періодичної синхронізації як частка (0–1) макс. інтервалу синхронізації. При 0.5 і 3 годинах синхронізація відбувається раз на 1,5–3 години.
  port:
    name: Порт додаткового вебсервера
    description: 'Порт, який слухає додатковий вебсервер усередині доповнення. Типово: 8471.'
  log_level:
    name: Рівень журналювання (вебінтерфейс)
    description: Наскільки детально записується журнал для вкладки «Журнал» вебінтерфейсу і звітів про помилки.
  console_log_level:
    name: Рівень журналювання (консоль)
    description: Наскільки докладний журнал на вкладці «Журнал» доповнення в Home Assistant.
  max_backoff_seconds:
    name: Макс. затримка між спробами
    description: Найдовше очікування між спробами після невдалої синхронізації, у секундах (щонайменше 3600).
  ha_reporting_interval_seconds:
    name: Інтервал оновлення датчиків
    description: Як часто доповнення оновлює свої датчики в Home Assistant, у секундах.
network:
  8471/tcp: Додатковий вебсервер, поза ingress (лише коли ввімкнено «Увімкнути додатковий вебсервер»).
